<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slicesky</title>
<style>
  :root { --bg:#0f1b2d; --card:rgba(10,18,34,.82); --text:#eef3fa; --muted:#d3deee; --accent:#4cc3ff; --err:#ff8a8a; }
  * { box-sizing: border-box; }
  #sky { position:fixed; inset:0; width:100%; height:100%; z-index:-1; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(rgba(5,12,26,.55), rgba(5,12,26,.25) 35%, rgba(5,12,26,.35) 70%, rgba(5,12,26,.65)); }
  main { flex:1; width:100%; max-width:480px; margin:0 auto; padding:20px 16px; }
  h1 { display:inline-block; padding:6px 14px; border-radius:10px; background:rgba(10,18,34,.78); text-shadow:0 1px 3px rgba(0,0,0,.6); margin:0 0 16px; font-size:1.4rem; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  form { display:flex; gap:8px; }
  input::placeholder { color:#b9c7dc; }
  input { flex:1; min-width:0; padding:12px 14px; font-size:1rem; border-radius:10px; border:1px solid #2c4166; background:rgba(10,18,34,.82); color:var(--text); }
  button { cursor:pointer; font-size:1rem; }
  form button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#06223a; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px; }
  .chips button { padding:7px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(10,18,34,.78); color:#fff; font-size:.9rem; }
  .chips button:hover { color:var(--text); border-color:var(--accent); }
  .card { background:var(--card); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:16px; padding:22px; }
  .banner { position:relative; margin:-22px -22px 16px; padding:14px 16px 0; height:120px; border-radius:16px 16px 0 0; background:linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.03)); color:#fff; overflow:hidden; }
  .banner svg { width:100%; height:100%; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.45)); }
  .banner span { position:absolute; top:10px; left:14px; font-size:.78rem; background:rgba(10,18,34,.75); padding:3px 9px; border-radius:999px; }
  .chips button.active { background:var(--accent); color:#06223a; border-color:var(--accent); font-weight:600; }
  .loc { text-shadow:0 1px 3px rgba(0,0,0,.6); color:var(--muted); margin:0 0 4px; }
  .temp { font-size:3.4rem; font-weight:700; margin:0; }
  .cond { display:flex; align-items:center; gap:8px; margin:4px 0 18px; color:var(--muted); }
  .cond img { width:48px; height:48px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid div { background:rgba(255,255,255,.08); border-radius:12px; padding:12px; }
  .grid small { display:block; color:var(--muted); margin-bottom:2px; }
  .grid b { font-size:1.15rem; }
  .msg { text-align:center; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.7); background:rgba(10,18,34,.7); border-radius:12px; padding:30px 10px; }
  .msg.err { color:#ffb3b3; }
  .msg button { margin-top:12px; padding:8px 16px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--accent); }
  .dev { margin-top:16px; }
  .dev summary { cursor:pointer; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); font-size:.9rem; }
  pre { color:#e6eefb; background:#0a1424; padding:12px; border-radius:10px; overflow:auto; font-size:.78rem; max-height:260px; }
  .dev button { padding:6px 12px; border-radius:8px; border:1px solid #2c4166; background:transparent; color:var(--muted); }
  footer { color:#e6eefb; text-shadow:0 1px 4px rgba(0,0,0,.8); text-align:center; padding:16px; color:var(--muted); font-size:.8rem; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Slice<span>sky</span></h1>
  <form id="form">
    <input id="q" type="search" placeholder="Search a city…" autocomplete="off" aria-label="City">
    <button type="submit">Search</button>
  </form>
  <div class="chips" id="chips"></div>
  <div id="out" aria-live="polite"></div>
  <details class="dev" id="dev" hidden>
    <summary>Developer: raw JSON</summary>
    <button id="copy" type="button">Copy JSON</button>
    <pre id="json"></pre>
  </details>
</main>
<footer>Weather data by <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a></footer>
<script src="/sky.js"></script>
<script src="/cities.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// label shown to user -> unambiguous query sent to the API (avoids e.g. Delhi, Canada)
const POPULAR = [["Mumbai","Mumbai, India"],["Delhi","New Delhi, India"],["Bengaluru","Bengaluru, India"],["Chennai","Chennai, India"],["Kolkata","Kolkata, India"],["Hyderabad","Hyderabad, India"],["London","London, United Kingdom"],["New York","New York, United States"]];
let lastQuery = "Mumbai";

POPULAR.forEach(([label, query]) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.dataset.key = label.toLowerCase();
  b.onclick = () => { $("q").value = ""; load(query); };
  $("chips").appendChild(b);
});

$("form").onsubmit = (e) => {
  e.preventDefault();
  const v = $("q").value.trim();
  if (!v) return show('<div class="msg">Type a city name to see its weather.</div>');
  load(v);
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("json").textContent); $("copy").textContent = "Copied!"; }
  catch { $("copy").textContent = "Copy failed"; }
  setTimeout(() => ($("copy").textContent = "Copy JSON"), 1500);
};

function show(html) { $("out").innerHTML = html; }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function mood(code, temp) {
  if ([1087,1273,1276,1279,1282].includes(code)) return "⛈️";
  if (code >= 1180 && code <= 1252) return "🌧️";
  if (code >= 1210 && code <= 1237) return "❄️";
  if (code === 1000) return temp >= 32 ? "🥵" : "😎";
  if (code <= 1030) return "⛅";
  return "☁️";
}

function error(msg, retry) {
  $("dev").hidden = true;
  show(`<div class="msg err">${esc(msg)}${retry ? '<br><button id="retry">Retry</button>' : ""}</div>`);
  if (retry) $("retry").onclick = () => load(lastQuery);
}

async function load(city) {
  lastQuery = city;
  show('<div class="msg">Fetching weather…</div>');
  if (!navigator.onLine) return error("You appear to be offline. Check your connection.", true);
  try {
    const r = await fetch(`/api/weather?q=${encodeURIComponent(city)}`);
    const d = await r.json();
    if (!r.ok) {
      const code = d?.error?.code;
      if (code === 1006) return error("We couldn’t find that city. Check the spelling and try again.");
      return error("Weather is unavailable right now. Please try again shortly.", true);
    }
    render(d);
  } catch {
    error("Couldn’t reach the weather service. Please try again.", true);
  }
}

function render(d) {
  const { location: l, current: c } = d;
  const place = [l.name, l.region, l.country].filter(Boolean).join(", ");
  show(`
    <div class="card">
      ${CityArt.html(l)}
      <p class="loc">${esc(place)}</p>
      <p class="temp">${mood(c.condition.code, c.temp_c)} ${c.temp_c}°C</p>
      <div class="cond"><img src="https:${esc(c.condition.icon)}" alt=""><span>${esc(c.condition.text)}</span></div>
      <div class="grid">
        <div><small>Feels like</small><b>${c.feelslike_c}°C</b></div>
        <div><small>Humidity</small><b>${c.humidity}%</b></div>
        <div><small>Wind</small><b>${c.wind_kph} kph</b></div>
        <div><small>UV index</small><b>${c.uv}</b></div>
      </div>
    </div>`);
  Sky.set(c.condition.code, c.is_day);
  const k = CityArt.keyFor(l);
  document.querySelectorAll("#chips button").forEach((b) => b.classList.toggle("active", !!k && b.dataset.key === k));
  $("json").textContent = JSON.stringify(d, null, 2);
  $("dev").hidden = false;
}

load("Mumbai"); // default city on launch
</script>
</body>
</html>
